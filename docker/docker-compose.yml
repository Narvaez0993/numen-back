name: numen-back

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
    healthcheck:
      test: |
        mongosh --quiet --eval '
          try {
            rs.status().ok;
          } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
          }
        '
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      MONGO_URI: "mongodb://mongo:27017/?replicaSet=rs0&directConnection=true"
      MONGO_DB_NAME: numen
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-do-not-use-in-prod-32chars-min-length-please
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
    command: ["uvicorn", "src.core.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      MONGO_URI: "mongodb://mongo:27017/?replicaSet=rs0&directConnection=true"
      MONGO_DB_NAME: numen
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-do-not-use-in-prod-32chars-min-length-please
    volumes:
      - ../src:/app/src
    command: ["arq", "src.core.workers.WorkerSettings"]

volumes:
  mongo-data:
