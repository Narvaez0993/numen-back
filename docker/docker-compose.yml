name: numen-back

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--quiet"]
    # attach: false → Compose NO muestra el stdout de mongo en `docker compose up`.
    # Los logs SÍ siguen accesibles vía `docker compose logs mongo` si los necesitás.
    attach: false
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
    healthcheck:
      test: |
        mongosh --quiet --eval '
          try {
            rs.status().ok;
          } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
          }
        '
      # 5s mientras inicializa (start_period), luego 30s — reduce ruido de connection logs
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      MONGO_URI: "mongodb://mongo:27017/?replicaSet=rs0&directConnection=true"
      MONGO_DB_NAME: numen
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-do-not-use-in-prod-32chars-min-length-please
      # The assistant's model calls. Set it in docker/.env (gitignored) — compose
      # interpolates from the file next to this one, not from the repo root.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # A day of testing captures burns through the real free tier, and hitting it
      # mid-sentence is indistinguishable from the app mishearing you. Override in
      # docker/.env; unset, it is exactly what a free account gets.
      ASSISTANT_REGISTRATIONS_FREE_LIMIT: ${ASSISTANT_REGISTRATIONS_FREE_LIMIT:-60}
      ASSISTANT_REGISTRATIONS_PLUS_LIMIT: ${ASSISTANT_REGISTRATIONS_PLUS_LIMIT:-300}
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
    command: ["uvicorn", "src.core.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      MONGO_URI: "mongodb://mongo:27017/?replicaSet=rs0&directConnection=true"
      MONGO_DB_NAME: numen
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-do-not-use-in-prod-32chars-min-length-please
      # The narrator (El Corte) runs in the worker, not the API.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_REGISTRATIONS_FREE_LIMIT: ${ASSISTANT_REGISTRATIONS_FREE_LIMIT:-60}
      ASSISTANT_REGISTRATIONS_PLUS_LIMIT: ${ASSISTANT_REGISTRATIONS_PLUS_LIMIT:-300}
    volumes:
      - ../src:/app/src
    command: ["arq", "src.core.workers.WorkerSettings"]

volumes:
  mongo-data:
