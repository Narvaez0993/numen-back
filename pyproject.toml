[project]
name = "back-numen"
version = "0.1.0"
description = "Backend for numen (Gastos by IM v2) — hexagonal + FastAPI + MongoDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.118.0",
    "uvicorn[standard]>=0.32.0",
    # Settings & validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # MongoDB — pymongo's native async client (Beanie 2.x uses it directly; motor deprecated)
    "beanie>=2.0.0",
    "pymongo>=4.9.0",
    # Auth
    "pyjwt>=2.10.0",
    "argon2-cffi>=23.1.0",
    # Background jobs
    "arq>=0.26.3",
    "redis>=5.2.0",
    # AI
    "anthropic>=0.40.0",
    "openai>=1.60.0",
    # Storage
    "aioboto3>=13.3.0",
    # Observability
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.20.0",
    # HTTP client
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "testcontainers[mongodb]>=4.9.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "import-linter>=2.1.0",
    "pre-commit>=4.0.0",
    "types-aioboto3>=13.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # bugbear
    "C4",    # comprehensions
    "SIM",   # simplify
    "RET",   # return
    "RUF",   # ruff
    "ASYNC", # async checks
    "PT",    # pytest style
]
ignore = [
    "B008",  # FastAPI uses Depends() in default args
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_decorators = false  # FastAPI decorators don't have full types
plugins = ["pydantic.mypy"]
exclude = ["migrations/", ".venv/"]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*", "migrations/*"]
